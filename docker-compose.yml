  postgres:
    image: postgres:14
    container_name: postgres-container
    environment:
      POSTGRES_USER: dhruvamalik05
      POSTGRES_PASSWORD: dhruvamalik05
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dhruvamalik05@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-dhruvamalik05}
#      PGADMIN_DEFAULT_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5051:80"
    networks:
      - postgres
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: my-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - postgres

  redis:
    image: redis:7.4-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - postgres

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - postgres

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Connects Kafka to the ZooKeeper container on port 2181
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Exposes Kafka to your host machine (localhost:9092)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

      KAFKA_BROKER_ID: 1
      # Required minimum settings for a single-node configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

#      KAFKA_PROCESS_ROLES: BROKER, CONTROLLER
    depends_on:
      - zookeeper
    networks:
      - postgres



networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  rabbitmq:


