spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: dhruvamalik05
    password: dhruvamalik05
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown: { enabled: true }
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    serverUrl:
      defaultZone: "https://localhost:8761"
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.ecommerce.order: TRACE
  file:
    name: logs/${spring.application.name}.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 7

server:
  port: 8083

#circuit breaker config

resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: COUNT_BASED
  retry:
    instances:
      retryBreaker:
        maxAttempts: 5
        waitDuration: 500ms


  ratelimiter:
    instances:
      retryLimiter:
        timeout-duration: 0
        limit-refresh-period: 4s
        limit-for-period: 2

