spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: dhruvamalik05
    password: dhruvamalik05
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint: { shutdown: { enabled: true } }

  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    serverUrl:
      defaultZone: "https://localhost:8761"
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.ecommerce.order: TRACE
  file:
    name: logs/${spring.application.name}.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 7

server:
  port: 8083
