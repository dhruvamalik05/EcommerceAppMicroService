spring:
  application:
    name: configserver
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:///C:\Users\dhruv\Java\EcommerceAppMicroService\configserver\configserver\src\main\resources\config
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint: { shutdown: { enabled: true } }

