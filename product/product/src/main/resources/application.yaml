spring:
  application:
    name: product-service
  config:
    import: optional:configserver:http://localhost:8888

eureka:
  client:
    serverUrl:
      defaultZone: "https://localhost:8761"
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include:
          - shutdown
  endpoint: { shutdown: { enabled: true } }


